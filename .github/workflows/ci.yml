name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: SP:35 reference oracle (book examples + KB consistency)
        run: uv run --no-project --with pyyaml python tools/sp35_reference_check.py
      - name: Tests (engine, vision post-processing, pilot builder)
        run: uv run --group dev pytest
      - name: Phase-0 verification (local-only evidence reports SKIP)
        run: uv run --with pyyaml python tools/verify_phase0.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t sp35-bridge-inspection:core .
      - name: Build test image
        run: docker build --target test -t sp35-bridge-inspection:test .
      - name: Validate Compose configuration
        run: docker compose config
      - name: Run core verification
        run: docker compose up --pull always --abort-on-container-exit --exit-code-from core core
      - name: Run containerized tests
        run: docker compose run --rm test
