name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: SP35 reference oracle
        run: uv run --with pyyaml python tools/sp35_reference_check.py
      - name: Tests
        run: uv run --group dev pytest -q
