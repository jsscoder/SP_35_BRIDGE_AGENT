[project]
name = "sp35-bridge-inspection-ai"
version = "0.0.1"
description = "Draft IRC:SP:35-2024 bridge inspection reports (SAM 3.1 + deterministic Ch.7 engine)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6",
  "pydantic>=2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
