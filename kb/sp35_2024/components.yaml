# Span model (§7.5.1, book p.131): single span -> both abutments; two spans -> each span with its
# abutment and the pier; multiple spans -> end spans (abutment + adjacent pier) and intermediate
# spans (both piers). Bridge BHI = minimum span BHI.
# SP:35 does not say how two supports of one span combine, or where approaches/waterway sit.
# The defaults below are decision E14 (needs engineer sign-off at G0).
span_model:
  decision: E14
  support_types:
    abutment: [C2.1, C2.2, C2.3, C2.4, C2.5, C2.6]
    pier: [C2.7, C2.8, C2.9]
  scope:
    C1: end_spans_only          # each end span takes its own approach
    C2: per_support             # span takes the worse CS_j of its two supports, per sub-component
    C3: bridge_level            # applied to every span
    C4: per_support             # foundations belong to supports; worse of the two
    C5: per_span
    C6: per_span
    C7: per_support             # bearings on the two support lines under the span; worse of the two
  not_in_span: exclude          # e.g. C1 for an intermediate span: left out of both sums in Eq. 1
  absent_element: na_scores_100 # element missing on the bridge: report NA, CS_j = 100 (book p.131)
  bridge_bhi: min_over_spans
