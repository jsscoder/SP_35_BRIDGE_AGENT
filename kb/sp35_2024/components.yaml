# IRC:SP:35-2024 Table 7.1 — Relative weights of bridge components and sub-components
# Source: book pp. 102-105 (AHP survey of Indian bridge experts, 9-point pairwise scale).
# Use `weight` of each component (Table 7.1 column 3) and of each sub-component (column 5) ONLY.
# Column 6 ("overall %") is NOT stored: it contains misprints (E5). Compute it if needed as W_i * W_j / 100.
# Main weights total 99.9; groups C1 and C6 total 99.9. Eq. 1 and Eq. 2 divide by the actual sum (E6).
# SP:35 allows rearranging or adding components as long as weights total 100 — any change is a new KB version.

kb_version: sp35_2024-kb0
source: "IRC:SP:35-2024, Table 7.1, pp. 102-105"
status: draft-for-signoff   # becomes `signed` at gate G0

