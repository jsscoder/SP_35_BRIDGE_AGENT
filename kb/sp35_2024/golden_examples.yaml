# Golden test cases from IRC:SP:35-2024 Chapter 7 worked examples.
# `book` = value printed in the book; `expected` = value the engine must produce; `tol` = allowed difference.
# Independent oracle: tools/sp35_reference_check.py (values below were produced by it on 2026-10-07).
# Never edit an expected value to make a test pass (see .agents/rules/testing-and-gates.md).

kb_version: sp35_2024-kb0

cs_examples:            # Eq. 3
  - id: p130_deck_slab
    source: "p.130, example under Eq. 3"
    distress_states: [II, III, II, I]     # honeycombing, spalling, exposed reinforcement, efflorescence
    book: 50.0
    expected: 75.0
    tol: 0.0
    decision: E1        # book scores state I as 0 instead of 100
  - id: p132_pier_cap
    source: "p.132, section 7.6"
    distress_states: [II, II, II, III]    # exposed reinforcement, spalling, corrosion, staining
    book: 68.75
    expected: 68.75
    tol: 0.0

bhi_examples:           # Eq. 1-3, Table 7.6 (pp. 133-135): Yamuna bridge, Delhi, inspected about 2010-11
  - id: yamuna_table_7_6
    note: >
      States per noticed distress; empty list = Nil, NA or not visible (all score 100).
      Table 7.6 prints CS 100 for guide bunds (vegetation II) and 50 for light posts (II);
      the strict variant scores them by state (E4). Both must land within tol of the book's 95.06.
    states:
      C1.1: []
      C1.2: [II]          # missing elements
      C1.3: []
      C1.4: [V]           # railing missing -> critical list
      C1.5: []
      C1.6: []
      C1.7: [II]          # clogging
      C1.8: [II]          # erosion
      C2.1: []
      C2.2: []
      C2.3: []
      C2.4: []            # NA
      C2.5: []
      C2.6: []
      C2.7: []
      C2.8: [II, II, II, III]
      C2.9: []            # NA
      C3.1: [II, III]     # silting, vegetation
      C3.2: [II]          # vegetation (printed CS 100)
      C3.3: []
      C3.4: []
      C3.5: []
      C3.6: []
      C3.7: []
      C3.8: []
      C3.9: []
      C4.1: []            # not visible
      C4.2: []
      C4.3: []
      C5.1: []
      C5.2: []
      C5.3: []
      C5.4: []
      C5.5: []
      C5.6: []            # NA
      C6.1: [II]          # rutting
      C6.2: []
      C6.3: [II]          # clogging
      C6.4: []
      C6.5: []
      C6.6: []
      C6.7: [II]          # crushing/damaged (printed CS 50)
      C6.8: [II]          # clogging
      C6.9: []
      C6.10: []           # NA
      C6.11: []           # NA
      C6.12: []
      C7.1: [II]          # rusting
      C7.2: [II]          # rusting
      C7.3: []            # NA
    printed_cs_overrides: {C3.2: 100.0, C6.7: 50.0}
    book:
      ci: {C1: 75.65, C2: 95.03, C3: 98.50, C4: 100.0, C5: 100.0, C6: 89.77, C7: 81.15}
      bhi: 95.06
      stars: 5
    expected:
      bhi_with_printed_cs: {value: 95.16, tol: 0.2, vs_book: 95.06}
      bhi_strict_states: {value: 95.01, tol: 0.2, vs_book: 95.06}
      ci_with_printed_cs: {C1: 75.73, C2: 95.44, C3: 98.50, C4: 100.0, C5: 100.0, C6: 89.86, C7: 81.15}
      stars: 5
      critical_list: [C1.4]

