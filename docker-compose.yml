services:
  core:
    image: jhoijlk/sp35-bridge-inspection:latest
    pull_policy: always
    read_only: true
    init: true
    tmpfs:
      - /tmp
    command: ["python", "-m", "tools.sp35_reference_check"]

  test:
    build:
      context: .
      target: test
    image: sp35-bridge-inspection:test
    read_only: true
    init: true
    tmpfs:
      - /tmp
    command: ["/app/.venv/bin/pytest", "-o", "cache_dir=/tmp/pytest-cache"]

  # Weights are read from ./data/weights (fetch them on the host first). No token is
  # passed in by default; to fetch inside the container, forward it explicitly:
  #   docker compose run --rm -e HF_TOKEN gpu python tools/fetch_weights.py
  gpu:
    profiles: ["gpu"]
    build:
      context: .
      target: gpu
    image: sp35-bridge-inspection:gpu
    gpus: all
    volumes:
      - ./data:/app/data:rw
    init: true
    shm_size: "2gb"
    command: ["python", "-m", "vision.infer", "--help"]
